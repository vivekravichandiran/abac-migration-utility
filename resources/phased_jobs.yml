resources:
  jobs:
    abac_migration_inventory_job:
      name: "ABAC Migration - 1. Inventory"
      description: >-
        Isolated-phase pipeline, step 1 of 3. Read-only discovery/reporting
        pass over `catalogs` (SELECTED_CATALOGS) - classifies every table as
        ELIGIBLE/NOT_ELIGIBLE and never mutates Unity Catalog. Also runs the
        LLM-assisted PII tagging pass (enable_llm_pii_tagging=true here) that
        classifies each legacy row-filter/column-mask function's likely PII
        category from its name + governed column(s) alone, via ai_query() -
        purely advisory, recorded on the inventory table, never affects
        eligibility. Run this first, review the inventory table, then run
        "ABAC Migration - 2. Apply ABAC".
      max_concurrent_runs: 1
      tasks:
        - task_key: run_inventory
          notebook_task:
            notebook_path: ../notebooks/abac_migration_run.py
            base_parameters:
              warehouse_id: ${var.warehouse_id}
              mode: "INVENTORY"
              scope_type: "SELECTED_CATALOGS"
              catalogs: ${var.catalogs_json}
              exclude_schema_regex: "^information_schema$"
              dry_run: "true"
              continue_on_error: "true"
              max_parallelism: "4"
              audit_catalog: ${var.audit_catalog}
              audit_schema: ${var.audit_schema}
              policy_strategy: "TABLE_BASED"
              prefer_existing_tags: "true"
              enable_llm_pii_tagging: "true"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"

    abac_migration_apply_abac_job:
      name: "ABAC Migration - 2. Apply ABAC"
      description: >-
        Isolated-phase pipeline, step 2 of 3. For every ELIGIBLE table in
        `catalogs`, creates + verifies the new ABAC ROW_FILTER/COLUMN_MASK
        policy (and the governed tag(s) it depends on - one tag key per
        legacy function, see abac_migration/migration/tag_provisioner.py).
        Deliberately does NOT remove the legacy row filter/column mask -
        the table ends up with BOTH mechanisms active at once, which is
        never a security gap (strictly additive). Recorded in
        migration_audit with migration_phase=ABAC_APPLIED (explicitly not
        final). Run "ABAC Migration - 3. Finalize" once you've reviewed/
        confirmed the new policies look correct. Override
        `policy_except_principals` (JSON array, default `[]`) to exempt
        specific principals - e.g. a service principal running unmasked
        ETL - from every ABAC policy this run creates.
      max_concurrent_runs: 1
      tasks:
        - task_key: run_apply_abac
          notebook_task:
            notebook_path: ../notebooks/abac_migration_run.py
            base_parameters:
              warehouse_id: ${var.warehouse_id}
              mode: "APPLY_ABAC"
              scope_type: "SELECTED_CATALOGS"
              catalogs: ${var.catalogs_json}
              exclude_schema_regex: "^information_schema$"
              dry_run: "true"
              continue_on_error: "true"
              max_parallelism: "4"
              audit_catalog: ${var.audit_catalog}
              audit_schema: ${var.audit_schema}
              policy_strategy: "TABLE_BASED"
              policy_except_principals: "[]"
              prefer_existing_tags: "true"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"

    abac_migration_finalize_job:
      name: "ABAC Migration - 3. Finalize"
      description: >-
        Isolated-phase pipeline, step 3 of 3. For every table in `catalogs`
        whose ABAC policy was already applied by "ABAC Migration - 2. Apply
        ABAC" (or an atomic MIGRATE run), removes the legacy row filter/
        column mask and does the final state verification. Refuses
        (NOT_ELIGIBLE/ABAC_NOT_APPLIED_YET) for anything Apply-ABAC hasn't
        touched yet - never creates a policy itself. Recorded in
        migration_audit with migration_phase=FINALIZED on success.
      max_concurrent_runs: 1
      tasks:
        - task_key: run_finalize
          notebook_task:
            notebook_path: ../notebooks/abac_migration_run.py
            base_parameters:
              warehouse_id: ${var.warehouse_id}
              mode: "FINALIZE"
              scope_type: "SELECTED_CATALOGS"
              catalogs: ${var.catalogs_json}
              exclude_schema_regex: "^information_schema$"
              dry_run: "true"
              continue_on_error: "true"
              max_parallelism: "4"
              audit_catalog: ${var.audit_catalog}
              audit_schema: ${var.audit_schema}
              policy_strategy: "TABLE_BASED"
              prefer_existing_tags: "true"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"
