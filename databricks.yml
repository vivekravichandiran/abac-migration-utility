# Databricks Asset Bundle for the ABAC Migration Utility.
#
# Deploys:
#   - The `abac_migration` Python package as plain workspace files (NOT a
#     wheel - no `python setup.py bdist_wheel`, no build step of any kind).
#     `databricks bundle deploy` syncs the whole bundle tree (respecting
#     `.gitignore` + the `sync.exclude` list below) straight to the
#     workspace under each target's `root_path`. Since none of
#     `abac_migration/**/*.py` carry the `# Databricks notebook source`
#     header, they land as ordinary importable Python files, not notebooks
#     - every job's driver notebook adds that synced directory to
#     `sys.path` before `import abac_migration...` (see
#     `notebooks/abac_migration_run.py` / `notebooks/abac_migration_full_e2e_test.py`).
#     This is the same idea as the manual pre-bundle spike
#     (`abac_migration/spike/upload_package_to_workspace.py`), just done
#     automatically by `bundle deploy` instead of a one-off script.
#   - `abac_migration_job`          - the production-facing, parameterized
#                                     ATOMIC migration job (INVENTORY/MIGRATE/
#                                     INVENTORY_AND_MIGRATE/VERIFY/RECONCILE/
#                                     ROLLBACK) - creates the ABAC policy AND
#                                     removes legacy security in one run.
#   - abac_migration_inventory_job / abac_migration_apply_abac_job /
#     abac_migration_finalize_job (resources/phased_jobs.yml) - the ISOLATED
#     -PHASE alternative: run as 3 separate steps (Inventory -> Apply ABAC
#     -> Finalize), with an explicit non-final "both mechanisms active"
#     resting state in between Apply ABAC and Finalize for review.
#   - `abac_migration_full_e2e_test_job` - the full scenario-coverage test
#                                     job used to validate the utility
#                                     end-to-end against live Unity Catalog.
#
# Usage:
#   databricks bundle validate -t source
#   databricks bundle deploy   -t source
#   databricks bundle run      abac_migration_job -t source
#
#   databricks bundle validate -t target --profile uc_target
#   databricks bundle deploy   -t target --profile uc_target
#   databricks bundle run      abac_migration_inventory_job  -t target --profile uc_target
#   databricks bundle run      abac_migration_apply_abac_job -t target --profile uc_target
#   databricks bundle run      abac_migration_finalize_job   -t target --profile uc_target
#
# CI: `databricks bundle deploy` never shells out to Python at all - file
# sync is a pure Databricks CLI/API operation (Workspace Import API), same
# as `git push`. Any CI runner that can install the Databricks CLI and set
# DATABRICKS_HOST/DATABRICKS_TOKEN can run `databricks bundle deploy`
# directly - no Python toolchain, build step, or pipeline scaffolding
# required.
#
# Both `source` and `target` below point at the two workspaces already used
# throughout development/testing (see ~/.databrickscfg profiles `uc_source`
# / `uc_target` - two distinct metastores). `target`'s `warehouse_id` and
# `catalogs_json` are already filled in below (see abac_migration/spike/
# setup_target_phased_test.py for the fixtures the phased jobs expect there).

bundle:
  name: abac_migration

include:
  - resources/*.yml

# Dev-only content that should never be pushed to the workspace as part of
# every deploy: tests, one-off spike/setup scripts, the source PDF design
# doc, and anything already covered by .gitignore (__pycache__, dist/,
# build/, egg-info, .databricks/, etc. - bundle sync respects .gitignore
# automatically, this list is the extra stuff that isn't gitignored).
sync:
  exclude:
    - "abac_migration/tests/**"
    - "abac_migration/spike/**"
    - "abac_sales_demo/**"
    - "*.md"

variables:
  warehouse_id:
    description: >-
      SQL warehouse ID used by the resilient SQL Statement Execution API
      client for every ABAC/Unity Catalog statement (CREATE POLICY,
      CREATE GOVERNED TAG, DESCRIBE POLICY, ...). Must resolve to DBR/SQL
      warehouse version >= 18.1 (governed tags requirement).
    default: "525de76b2ccdd7d5"
  audit_catalog:
    description: Catalog that hosts the audit + inventory Delta tables.
    default: "ril_raw"
  audit_schema:
    description: Schema (inside audit_catalog) that hosts the audit + inventory Delta tables.
    default: "abac_migration_audit"
  catalogs_json:
    description: >-
      JSON list of catalogs the main job's SELECTED_CATALOGS default scope
      covers - deliberately explicit rather than ALL_CATALOGS (see
      resources/jobs.yml). Override per workspace/target.
    default: '["ril_raw","ril_curated","ril_bulk","ril_migration","ril_sandbox"]'
  policy_scope:
    description: >-
      Selects the ABAC policy-attachment strategy used by every mutating
      job (abac_migration_job, abac_migration_apply_abac_job,
      abac_migration_finalize_job) - see DESIGN.md §7.3.1 / SOP.md §2.1.
      `TABLE` = "table level application" (default): one ABAC policy
      `ON TABLE` per table / per masked column, exclusive to that table.
      `CATALOG` = "catalog level application": one ABAC policy `ON CATALOG`
      per legacy function, shared by every table that function used to
      guard. Must be the same value across Inventory -> Apply ABAC ->
      Finalize for one migration; changing it mid-pipeline produces
      incorrect eligibility/state detection.
    default: "TABLE"
  policy_except_principals:
    description: >-
      JSON list of principals fully exempted (`TO account users EXCEPT
      <principal>, ...`) from every ABAC policy the mutating jobs create
      (abac_migration_job, abac_migration_apply_abac_job) - e.g. a service
      principal running unmasked ETL, or a break-glass admin group.
      Exempted principals see fully unmasked/unfiltered data. Empty (the
      default) omits the `EXCEPT` clause entirely - unchanged behavior.
    default: "[]"

targets:
  source:
    mode: development
    default: true
    workspace:
      host: https://adb-7405618912789045.5.azuredatabricks.net

  target:
    mode: production
    workspace:
      host: https://adb-7405609958717235.15.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      # Serverless Starter Warehouse on the target workspace (DBR/SQL
      # channel supports governed tags/ABAC policies - verified live).
      warehouse_id: "03ac4037e7134a18"
      # Scoped to just ril_raw (which also exists on this - completely
      # separate - metastore) so a run only touches the dedicated
      # ril_raw.abac_migration_phased_test fixtures created by
      # abac_migration/spike/setup_target_phased_test.py, not every
      # catalog on the workspace.
      catalogs_json: '["ril_raw"]'

  catalog_scope_test:
    # Third, distinct workspace/metastore - authenticated via OAuth M2M
    # service principal (client_id/client_secret in ~/.databrickscfg
    # profile `ril_catalog_test`, not a PAT), used specifically to validate
    # policy_scope=CATALOG ("catalog level application", DESIGN.md §7.3.1)
    # stage by stage (INVENTORY -> APPLY_ABAC -> FINALIZE) against the
    # dedicated `ril_catalog_scope_test` catalog created by
    # abac_migration/spike/setup_ril_catalog_scope_test.py, where two
    # legacy functions per schema deliberately guard 2 tables each - so a
    # single CATALOG-scoped ABAC policy consolidating both tables is
    # directly observable after Apply ABAC.
    mode: production
    workspace:
      host: https://adb-7405616318078204.4.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      warehouse_id: "5fe1692f119e2528"
      catalogs_json: '["ril_catalog_scope_test"]'
      audit_catalog: "ril_catalog_scope_test"
      audit_schema: "governance"
      # The whole reason this target exists: exercise catalog level
      # application end to end instead of the table-level default.
      policy_scope: "CATALOG"
